# 导航菜单（示例）
menu:
  Home: /
  Archives: /archives/
  About: /about/

# 站点基础
index_img: /img/banner.jpg   # 可稍后放一张图到 source/img/banner.jpg
# 头像配置（Butterfly 推荐写法）
avatar:
  img: /img/portrait.jpg?v=3  # 使用 jpg 并更新版本参数防缓存
  effect: false  # 关闭默认旋转，改为仅悬停旋转
subtitle:
  enable: true
  text: "博士通关中"

# 动效/体验
pjax: true
lazyload:
  enable: true
  # 仅对文章内容懒加载，避免侧边栏/导航等基础 UI 被懒加载后 PJAX 下不刷新
  field: post
  native: false
copy_btn: true
code_copy:
  enable: true

# 站点图标与自定义注入
# 优先使用主题内置 favicon_tag 渲染，统一各页面的标签图标
favicon: /img/yaziduck.png?v=3
# 通过 inject 在 <head> 中注入 favicon 与自定义样式（保留，作为兜底）
inject:
  head:
    - <link rel="icon" href="/img/yaziduck.png?v=3" type="image/png" sizes="any">
    - <link rel="apple-touch-icon" sizes="180x180" href="/img/yaziduck.png?v=3">
    - <link rel="stylesheet" href="/css/custom.css?v=4">
    - <script defer src="/js/site-effects.js?v=5"></script>
    - <script defer src="/js/rotating-title.js?v=1"></script>
  bottom:
    # 云朵、点击小鸭子和页脚动画统一由 head 中的 site-effects.js 初始化。
    - |
      <style>
        /* Footer softer color scheme */
        footer#footer, #footer, footer.footer, .footer, .footer-other, #footer .footer-bar, #footer .footer-wrap {
          background: #f5f8ff !important;
          color: #1f2740 !important;
        }
        #footer a, .footer a, .footer-other a { color: #1e4b8f !important; }
        #footer a:hover, .footer a:hover, .footer-other a:hover { color: #11386b !important; }
        .footer-other { padding: 20px 0 !important; min-height: 38px !important; }
        #footer .footer-wrap { padding-top: 6px !important; padding-bottom: 6px !important; }
        footer#footer, #footer, footer.footer, .footer, .footer-other { position: relative !important; overflow: visible !important; }

        /* Right-side progress to light gray-white */
        #rightside .progress, #rightside .progress span, #rightside .bar, .rightside .progress, .rightside .bar { background-color: #e9edf3 !important; }
        #rightside svg circle { stroke: #e9edf3 !important; }
        #rightside svg circle.progress, #rightside svg .progress { stroke: #cfd6df !important; }
        #progress-bar, .progressbar { background-color: #e9edf3 !important; }
        #progress-bar .bar, .progressbar .bar { background-color: #cfd6df !important; }

        /* Walking duck */
        .footer-duck { position: absolute; bottom: 8px; left: 0; width: 28px; height: auto; pointer-events: none; z-index: 3;
          animation: footer-duck-walk var(--footer-duck-duration, 22s) linear 1 forwards; transform: translateX(-10vw); }
        @keyframes footer-duck-walk { 0% { transform: translateX(-10vw); opacity: 0; } 5% { opacity: 1; } 95% { transform: translateX(110vw); opacity: 1; } 100% { transform: translateX(110vw); opacity: 0; } }
      </style>
    - |
      <style>
        footer#footer, #footer, footer.footer, .footer, .footer-other, #footer .footer-bar, #footer .footer-wrap {
          background: #0f2e5e !important;
          color: #ffffff !important;
        }
        #footer a, .footer a, .footer-other a { color: #e6efff !important; }
        #footer a:hover, .footer a:hover, .footer-other a:hover { color: #ffffff !important; }
        footer#footer, #footer, footer.footer, .footer, .footer-other { position: relative !important; overflow: visible !important; }
        .footer-duck { position: absolute; bottom: 8px; left: 0; width: 28px; height: auto; pointer-events: none; z-index: 3; animation: footer-duck-walk var(--footer-duck-duration, 22s) linear 1 forwards; transform: translateX(-10vw); }
        @keyframes footer-duck-walk { 0% { transform: translateX(-10vw); opacity: 0; } 5% { opacity: 1; } 95% { transform: translateX(110vw); opacity: 1; } 100% { transform: translateX(110vw); opacity: 0; } }
      </style>

# 页脚
footer:
  since: 2024
  icon: false
  copyright:
    enable: false

# 使用不蒜子兼容服务，沿用 Butterfly 的统计显示，不迁移旧计数。
# 全站访客数、全站浏览量、每篇文章浏览量。
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 原版计数接口不可用，使用 soxft/busuanzi 提供的公共服务。
CDN:
  option:
    busuanzi: https://busuanzi.9420.ltd/js

# 搜索
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1
  unescape: true

# 文章卡片动画
animation:
  enable: true
  post_list: true
  mask: true

aside:
  enable: true
  # 侧边栏公告卡片
  card_announcement:
    enable: true
    # 支持纯文本或 HTML，可写多行
    content: |
      欢迎来到本站！🎉<br>
      - 近期更新：新增一篇博文；<br>
      - 联系方式：liu_jiaxuan2021@163.com<br>
      - 框架 Hexo 8.0.0，主题 Butterfly 5.5.0
    # 可选：是否默认折叠
    hide: false

  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/Jiaxuan2021
